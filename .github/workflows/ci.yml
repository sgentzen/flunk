name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # `auto` (setup-uv v10+) disables the cache on non-github-hosted
      # runners and for tag pushes, pull_request_target, workflow_run and
      # release events -- cache-poisoning protection. It is identical to
      # `true` for this workflow today (github-hosted, branch push and
      # pull_request only), so this is fail-safe rather than a behaviour
      # change: a future tag- or release-triggered workflow copying this
      # step inherits the protection instead of silently opting out.
      # The one cost is that moving to self-hosted runners would lose the
      # cache; set `true` explicitly if that ever happens.
      #
      # setup-uv v9 also flipped `prune-cache` to default false, so the
      # cache is now larger than it was. Accepted: the dependency set is 36
      # packages, and upstream changed it to ease load on PyPI.
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: auto

      # Split in two so third-party dependencies install wheels-only: no
      # *locked* dependency's build backend gets to execute code in CI.
      # `--no-build` can't cover the second step because the first-party
      # editable install of flunk itself has no wheel and must be built.
      # One accepted exception: that build resolves `uv_build` (pyproject's
      # build-system requires), which is not in uv.lock and so is covered by
      # neither --locked nor step 1.
      #
      # Step 1 is fail-closed by ordering: step 2 resolves the same set minus
      # the project, so a dependency going sdist-only breaks step 1 first --
      # unless setup-uv's cache still holds a wheel it built earlier.
      - name: Sync dependencies (wheels only, no build scripts)
        run: uv sync --locked --all-extras --dev --no-install-project --no-build --python ${{ matrix.python-version }}

      - name: Install project (first-party build only)
        run: uv sync --locked --all-extras --dev --python ${{ matrix.python-version }}

      # `--no-build` on these steps is inert: `--no-sync` installs nothing, so
      # there is never a package to refuse. It is kept because Sonar
      # githubactions:S8541 flags a bare `uv run`, and because it would become a
      # real guard if `--no-sync` were ever dropped. Do NOT add it to the second
      # sync step above -- uv then refuses to build the first-party editable
      # `flunk` package and CI fails on both matrix legs.
      #
      # `uv run --no-sync` reuses the environment built by the sync steps above.
      # Without it, a bare `uv run` re-infers Python from requires-python (>=3.12),
      # recreates the venv as 3.12 without the extras, and drops `anthropic` --
      # breaking the 3.13 job's mypy/tests.
      - name: Lint (ruff)
        run: uv run --no-build --no-sync ruff check .

      - name: Type-check (mypy)
        run: uv run --no-build --no-sync mypy src

      - name: Test
        # Catalog/self-audit tests that need the sibling regression projects
        # (../job-stalker, ../erate-*) skip automatically on a bare checkout --
        # see tests/conftest.py.
        run: uv run --no-build --no-sync pytest -q
