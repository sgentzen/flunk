name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true

      - name: Sync (all extras + dev group)
        run: uv sync --all-extras --dev --python ${{ matrix.python-version }}

      # `uv run --no-sync` reuses the environment built by the sync step above.
      # Without it, a bare `uv run` re-infers Python from requires-python (>=3.12),
      # recreates the venv as 3.12 without the extras, and drops `anthropic` —
      # breaking the 3.13 job's mypy/tests.
      - name: Lint (ruff)
        run: uv run --no-sync ruff check .

      - name: Type-check (mypy)
        run: uv run --no-sync mypy src

      - name: Test
        # Catalog/self-audit tests that need the sibling regression projects
        # (../job-stalker, ../erate-*) skip automatically on a bare checkout —
        # see tests/conftest.py.
        run: uv run --no-sync pytest -q

      - name: CLI smoke test
        run: uv run --no-sync flunk --help
